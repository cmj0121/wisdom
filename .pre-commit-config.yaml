repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint-fix
        # A `make eval` case is fixture input, not documentation. The body of a
        # prompt.md is sent to the model verbatim, so the H1 that MD041 wants
        # would become part of the prompt and change what the case measures; a
        # grader's body is prose the report prints back. Excluding the case
        # directories keeps MD041 on for every document that is one.
        exclude: "^plugins/[^/]+/evals/[^/]+/"
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier

  # -------- shell-script related linter --------
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
      - id: script-must-have-extension
      - id: script-must-not-have-extension
      - id: shfmt

  # -------- marketplace integrity --------
  # These five are the repo's own checks. Four run unconditionally; the fifth
  # stays gated on scripts/. See each comment for why.
  - repo: local
    hooks:
      # This one cannot be gated by `files:`. pre-commit builds its candidate
      # list with `--diff-filter=ACMRTUXB`, which drops deletions, so a commit
      # that only removes plugins/<name>/LICENSE offers zero files and every
      # gated hook is skipped. Deleting a packaging file is exactly what this
      # check exists to catch, so it runs unconditionally (~2.5s).
      - id: marketplace-structure
        name: marketplace structure
        description: Fail if a plugin is missing plugin.json or LICENSE, a manifest name drifts, a hook path dangles, or a check script is gone.
        entry: scripts/test
        language: script
        pass_filenames: false
        always_run: true
      # Same reason. Gated, this one and validate below would be disarmed on a
      # deletion-only commit, so `git rm` of a plugin.json, of README.md or of
      # scripts/validate would commit green.
      - id: marketplace-version-sync
        name: marketplace version sync
        description: Fail if marketplace versions drift from plugin.json, lag the latest git tag, or a changed plugin is unbumped.
        entry: scripts/check-version-sync
        language: script
        pass_filenames: false
        always_run: true
      # --per-commit lets a README row land in an earlier commit than its skill.
      # `make test` and CI run the full form, which still catches the gap.
      - id: marketplace-semantic-validate
        name: marketplace semantic validation
        description: Fail if plugin descriptions, magic words, README skill tables, skill references or code fences are inconsistent.
        entry: scripts/validate --per-commit
        language: script
        pass_filenames: false
        always_run: true
      # It reads only SKILL.md files, but a commit that deletes one is exactly
      # when "does every skill still follow the standard" has a new answer, and
      # a gated hook would see nothing on such a commit.
      - id: skill-spec
        name: agent skills standard
        description: Fail if a SKILL.md carries an unknown frontmatter field, or breaks the Agent Skills naming, description, shape or progressive-disclosure rules.
        entry: scripts/check-skill-spec
        language: script
        pass_filenames: false
        always_run: true
      # The one hook that stays gated: it is the slowest, and it only says
      # anything new when scripts/ changes. A deletion-only commit presents it
      # no file, but scripts/test already fails when a check script is gone.
      - id: marketplace-validator-fixtures
        name: marketplace validator fixtures
        description: Fail if a semantic or standard check can no longer be made to fail. Runs only when scripts/ changes.
        entry: scripts/validate-fixtures
        language: script
        pass_filenames: false
        files: "^scripts/"

  # -------- security related linter --------
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        # run the detect mode and show all the leak credentials
        entry: gitleaks detect --verbose --redact
